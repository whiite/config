### Bindings ###
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap panes directionally (repeatable)
bind -r C-h swap-pane -s "{left-of}"
bind -r C-j swap-pane -s "{down-of}"
bind -r C-k swap-pane -s "{up-of}"
bind -r C-l swap-pane -s "{right-of}"

# Swap windows left/right (repeatable, focus follows the moved window)
bind -r P swap-window -t -1 \; select-window -t :-1
bind -r N swap-window -t +1 \; select-window -t :+1

# Last window (moved from default l)
bind Tab last-window

# Preserve cwd on new panes/windows
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

### Settings ###
# Clipboard pass through
set -g set-clipboard on

### Theme - Tokyo Night theme ###
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left-length 30
set -g status-left "#[fg=#16161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26,nobold] "

set -g status-right-length 60
set -g status-right "#[fg=#565f89]%H:%M #[fg=#7aa2f7]%d-%b-%y "

set -g window-status-separator ""
set -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#{?window_zoomed_flag,Z:,}#W "
set -g window-status-activity-style "fg=#f7768e,bg=#1a1b26"
set -g window-status-bell-style "fg=#f7768e,bg=#1a1b26"

set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#7aa2f7,fg=#1a1b26"
set -g message-command-style "bg=#7aa2f7,fg=#1a1b26"

set -g mode-style "fg=#1a1b26,bg=#bb9af7"
